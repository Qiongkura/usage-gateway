[project]
name = "usage-gateway"
version = "0.1.0"
description = "Unified AI usage gateway: one API key, many upstreams, one dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "pywebview>=6.2.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 只拦真正的错误（语法可疑 / 未定义名 / f-string 问题 / 不可达），
# 风格类规则不启用，避免噪音
select = ["E9", "F63", "F7", "F82", "F841", "B904"]
ignore = ["F401"]
