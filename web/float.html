<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>tok/s</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    user-select: none;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* 玻璃卡片铺满窗口；pywebview transparent=True 下圆角外透出桌面 */
  body { padding: 0; background: transparent; }
  /* —— 液态玻璃卡片 —— */
  #win {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    color: #1a1d23;
    overflow: hidden;
    /* 实底白卡：可读性优先；玻璃感靠高光边 + 流光 + 圆角阴影 */
    background: linear-gradient(165deg, #ffffff 0%, #fbfcfd 100%);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow:
      0 12px 34px rgba(16, 24, 40, 0.18),
      inset 0 0 0 1px rgba(255, 255, 255, 0.45),
      inset 0 2px 8px rgba(255, 255, 255, 0.55),
      inset 0 -12px 28px rgba(255, 255, 255, 0.16);
  }
  /* 斜向流光 + 底部透镜厚度感 */
  #win::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(132deg,
      rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.12) 34%,
      rgba(255, 255, 255, 0.02) 52%, rgba(255, 255, 255, 0.18) 82%,
      rgba(255, 255, 255, 0.4) 100%);
  }
  #win::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    border-radius: inherit;
    box-shadow: inset 0 -14px 30px rgba(255, 255, 255, 0.15);
  }
  #win > * { position: relative; z-index: 1; }

  /* 置顶 / 关闭：仅在原生窗（pywebview）里显示，靠 js_api 真生效 */
  #ctl {
    position: absolute;
    top: 9px;
    right: 9px;
    z-index: 4;
    display: none;
    gap: 5px;
  }
  .btn {
    width: 20px; height: 20px; border: none; border-radius: 7px;
    background: rgba(255, 255, 255, 0.55); color: rgba(26, 29, 35, 0.62);
    font-size: 10px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
  .btn:hover { background: rgba(255, 255, 255, 0.9); color: #1a1d23; }
  .btn.close:hover { background: #ef4444; color: #fff; }

  /* 内容区上下留白完全对称；状态行悬浮在底部内边距里 */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    min-height: 0;
  }
  #tps {
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1.5px;
    color: #0d9d74;
    transition: color .25s;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    margin-top: 6px;
  }
  #unit {
    font-size: 10px;
    color: rgba(26, 29, 35, 0.52);
    margin-top: 3px;
    letter-spacing: .4em;
    font-weight: 700;
  }
  #spark {
    height: 26px;
    width: 100%;
    margin: 12px 0 12px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #spark i {
    width: 3px;
    border-radius: 1.5px 1.5px 0 0;
    background: rgba(13, 157, 116, 0.75);
    min-height: 2px;
    opacity: .4;
    transition: height .3s, opacity .3s;
  }
  #spark i:last-child { opacity: 1; }

  #meta {
    width: 100%;
    font-size: 10.5px;
    color: rgba(26, 29, 35, 0.72);
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-direction: column;
    gap: 2.5px;
  }
  #meta .row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
  }
  #meta .k {
    width: 30px;
    flex: none;
    color: rgba(26, 29, 35, 0.45);
    font-size: 9.5px;
    letter-spacing: .08em;
  }
  #meta .v {
    flex: 1;
    text-align: right;
    color: #3b4048;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #meta .v .costpill {
    display: inline-block;
    padding: 0.5px 8px;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.14);
    color: #b45309;
    font-weight: 700;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  #meta .v .dim { color: rgba(26, 29, 35, 0.45); font-weight: 500; }

  #status {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6px;
    z-index: 2;
    font-size: 8.5px;
    color: rgba(26, 29, 35, 0.4);
    text-align: center;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  #status .sdot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: #10b981;
    box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
  }
  #status.err { color: #ef4444; }
  #status.err .sdot {
    background: #ef4444;
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
  }
  .idle #tps { color: rgba(26, 29, 35, 0.22); }
</style>
</head>
<body>
<div id="win">
  <div id="ctl">
    <button class="btn" id="btn-pin" title="置顶锁定">📍</button>
    <button class="btn close" id="btn-close" title="关闭">✕</button>
  </div>
  <div id="main">
    <div id="tps">—</div>
    <div id="unit">TOK/S</div>
    <div id="spark"></div>
    <div id="meta">
      <div class="row"><span class="k">模型</span><span class="v" id="m-model">—</span></div>
      <div class="row"><span class="k">输入</span><span class="v" id="m-in">—</span></div>
      <div class="row"><span class="k">输出</span><span class="v" id="m-out">—</span></div>
      <div class="row"><span class="k">耗时</span><span class="v" id="m-lat">—</span></div>
      <div class="row"><span class="k">费用</span><span class="v" id="m-cost">—</span></div>
    </div>
  </div>

  <div id="status" title="点击设置统计密钥"><span class="sdot"></span><span id="status-text">连接中…</span></div>
</div>

<script>
const API = location.origin;
const POLL_MS = 1500;
const POLL_TIMEOUT_MS = 10000;
const SPARK_N = 36;

let history = [];
try { history = JSON.parse(localStorage.getItem('ug_spark') || '[]'); } catch (e) { history = []; }
if (!Array.isArray(history)) history = [];
let lastRecord = null;
let topmost = true;
let timer = null;
let pollSerial = 0;
let pollInFlight = false;
let pollController = null;

const $ = id => document.getElementById(id);
// 密钥仅保存在当前窗口内，不写入 URL 或持久存储。
let statsKey = '';
$('status').addEventListener('pointerdown', e => e.stopPropagation());
$('status').addEventListener('click', () => {
  const value = prompt('输入统计密钥（留空清除，仅保存在当前窗口）', '');
  if (value !== null) { statsKey = value; poll(true); }
});

function setStatus(text, isErr) {
  $('status-text').textContent = text;
  $('status').className = isErr ? 'err' : '';
}

// —— 原生窗（pywebview）专属：置顶锁定 / 关闭 / 拖动，经 js_api 调 Python ——
function pyApi(){ return window.pywebview && window.pywebview.api; }
$('btn-close').onclick = () => { const a = pyApi(); if (a) a.close_window(); };
$('btn-pin').onclick = () => {
  const a = pyApi();
  if (!a) return;
  topmost = !topmost;
  a.toggle_top(topmost);
  $('btn-pin').style.opacity = topmost ? '1' : '0.35';
  $('btn-pin').title = topmost ? '置顶锁定（点击取消）' : '已取消置顶（点击恢复）';
};
function showCtl(){ if (pyApi()) $('ctl').style.display = 'flex'; }
window.addEventListener('pywebviewready', showCtl);
setTimeout(showCtl, 900);   // 某些版本不派发该事件，兜底探测

// 拖动：光标增量 + SetWindowPos 始终带 TOPMOST，拖到哪都保持置顶
let dragging = false, pendingMove = false;
$('win').addEventListener('pointerdown', e => {
  if (e.target.closest('.btn')) return;
  const a = pyApi();
  if (!a) return;
  dragging = true;
  try { $('win').setPointerCapture(e.pointerId); } catch (err) {}
  a.drag_start();
});
$('win').addEventListener('pointermove', () => {
  if (!dragging || pendingMove) return;
  pendingMove = true;
  requestAnimationFrame(() => {
    pendingMove = false;
    const a = pyApi();
    if (a) a.drag_move();
  });
});
$('win').addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  const a = pyApi();
  if (a) a.drag_end();
});

function renderSpark() {
  const el = $('spark');
  if (!history.length) { el.innerHTML = ''; return; }
  const max = Math.max(...history, 1);
  const shown = history.slice(-36);
  el.innerHTML = shown.map(v => {
    const h = Math.max(2, Math.round(v / max * 26));
    return `<i style="height:${h}px"></i>`;
  }).join('');
}

function colorFor(tps) {
  if (tps >= 40) return '#10b981';
  if (tps >= 15) return '#f59e0b';
  if (tps > 0)   return '#ef4444';
  return '#d7dbe0';
}

function fmtK(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

// 单次费用自适应精度：小金额不舍成 $0.00
function fmtCost(v) {
  if (v == null || typeof v !== 'number' || isNaN(v)) return null;
  if (v >= 0.01)   return '$' + v.toFixed(4);
  if (v >= 0.0001) return '$' + v.toFixed(5);
  if (v > 0)       return '$' + v.toFixed(6);
  return '$0';
}

async function poll(force = false) {
  if (pollInFlight && !force) return;
  const serial = ++pollSerial;
  if (pollController) pollController.abort();
  const controller = new AbortController();
  pollController = controller;
  pollInFlight = true;
  let timedOut = false;
  const timeout = setTimeout(() => { timedOut = true; controller.abort(); }, POLL_TIMEOUT_MS);
  try {
    const r = await fetch(`${API}/api/speed?limit=1`, {
      cache: 'no-store', signal: controller.signal,
      headers: statsKey ? { 'X-Stats-Key-Encoded': encodeURIComponent(statsKey) } : {}
    });
    if (r.status === 401) throw new Error('请点击此处设置统计密钥');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (serial !== pollSerial) return;
    const latest = data.latest;

    setStatus('已连接 · ' + new Date().toLocaleTimeString('zh-CN'), false);

    if (!latest) {
      lastRecord = null;
      $('main').classList.add('idle');
      $('tps').textContent = '—';
      for (const id of ('m-model m-in m-out m-lat m-cost').split(' ')) {
        $(id).textContent = '—';
      }
      return;
    }

    // 新请求才更新大数字，避免闪烁；优先展示纯解码生成速率（排除首字等待）
    const record = latest.id != null ? `id:${latest.id}` : `ts:${latest.ts}`;
    const isNew = record !== lastRecord;
    if (isNew) {
      lastRecord = record;
      const tps = latest.gen_tok_per_sec || latest.tok_per_sec || 0;
      history.push(tps);
      if (history.length > SPARK_N) history.shift();
      try { localStorage.setItem('ug_spark', JSON.stringify(history)); } catch (e) {}
      renderSpark();

      $('main').classList.remove('idle');
      $('tps').textContent = tps >= 100 ? tps.toFixed(0) : tps.toFixed(1);
      $('tps').style.color = colorFor(tps);
    }

    const lat = latest.latency_ms >= 1000
      ? (latest.latency_ms / 1000).toFixed(1) + 's'
      : Math.round(latest.latency_ms) + 'ms';
    const ttft = latest.ttft_ms != null
      ? (latest.ttft_ms >= 1000 ? (latest.ttft_ms / 1000).toFixed(1) + 's' : Math.round(latest.ttft_ms) + 'ms')
      : '—';
    const avg = latest.tok_per_sec || 0;

    // 单次调用的完整数据：token 构成 / 缓存命中 / 思考 / 费用，一项不截断
    const prompt = (latest.input_tokens || 0) + (latest.cache_read || 0) + (latest.cache_write || 0);
    const hit = prompt > 0 ? Math.round((latest.cache_read || 0) / prompt * 100) : 0;
    const cost = fmtCost(latest.cost_usd);
    const outBits = [`↓${fmtK(latest.output_tokens)}`];
    if (latest.reasoning) outBits.push(`思考${fmtK(latest.reasoning)}`);
    if (latest.cache_write) outBits.push(`写${fmtK(latest.cache_write)}`);

    $('m-model').textContent = `${latest.source}/${latest.model || '?'}`;
    $('m-in').innerHTML = `↑${fmtK(prompt)} <span class="dim">· 命中${hit}% · 新${fmtK(latest.input_tokens || 0)}</span>`;
    $('m-out').innerHTML = `${outBits.join(' · ')}`;
    $('m-lat').innerHTML = `${lat} <span class="dim">· 首字 ${ttft} · 均 ${avg.toFixed(1)}</span>`;
    $('m-cost').innerHTML = cost
      ? `<span class="costpill">${cost}</span>${latest.gen_tok_per_sec ? ` <span class="dim">· 生成 ${latest.gen_tok_per_sec.toFixed(1)}</span>` : ''}`
      : '—';

    if (isNew) {
      $('win').animate(
        [{ boxShadow: '0 0 0 2px rgba(16,185,129,0.55)' }, { boxShadow: '0 8px 24px rgba(16,24,40,0.16)' }],
        { duration: 700, easing: 'ease-out' }
      );
    }
  } catch (e) {
    if (serial === pollSerial) setStatus(timedOut ? '连接超时，等待重试' : '连接失败: ' + e.message, true);
  } finally {
    clearTimeout(timeout);
    if (serial === pollSerial) { pollInFlight = false; pollController = null; }
  }
}

function start() {
  stop();
  poll();
  timer = setInterval(poll, POLL_MS);
}
function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  pollSerial++;
  if (pollController) pollController.abort();
  pollController = null;
  pollInFlight = false;
}

// 页面隐藏时降频，省资源
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stop(); else start();
});

start();
</script>
</body>
</html>
